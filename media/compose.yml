services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin

    network_mode: host

    volumes:
      - /opt/containers/jellyfin/config:/config
      - /opt/containers/jellyfin/cache:/cache
      - /storage/media:/media:ro

    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent

    network_mode: host

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - WEBUI_PORT=8080

    volumes:
      - /opt/containers/qbittorrent/config:/config
      - /storage/media:/media

    restart: unless-stopped
